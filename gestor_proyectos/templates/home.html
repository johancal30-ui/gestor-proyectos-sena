<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de Proyectos · Bienvenida</title>
  <!-- Tailwind CSS v3 CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Fuente opcional para un toque más moderno (Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
  <style>
    /* solo para aplicar la fuente, sin clases personalizadas */
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-50 to-blue-50 flex items-center justify-center p-4 antialiased">

  <main class="w-full max-w-3xl mx-auto text-center">
    <!-- tarjeta principal con efecto glassmorphism suave y sombra moderna -->
    <div class="bg-white/70 backdrop-blur-md rounded-3xl shadow-2xl shadow-blue-200/50 border border-white/40 p-10 sm:p-14 transition-all duration-300 hover:shadow-blue-300/30">
      
      <!-- icono decorativo (sin clases personalizadas) -->
      <div class="flex justify-center mb-6">
        <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-gradient-to-tr from-indigo-500 to-blue-600 shadow-lg shadow-indigo-200">
          <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L2 7l10 5 10-5-10-5z" />
            <path d="M2 17l10 5 10-5" />
            <path d="M2 12l10 5 10-5" />
          </svg>
        </div>
      </div>

      <!-- título principal -->
      <h1 class="text-4xl sm:text-5xl font-semibold tracking-tight text-slate-800 mb-3">
        Gestor de Proyectos
      </h1>

      <!-- línea decorativa sutil -->
      <div class="w-24 h-1 bg-gradient-to-r from-indigo-400 to-blue-400 rounded-full mx-auto my-4"></div>

      <!-- mensaje de bienvenida con énfasis -->
      <p class="text-xl sm:text-2xl font-medium text-slate-700 mt-2 mb-4">
        Bienvenido
      </p>

      <!-- descripción amable, solo bienvenida -->
      <p class="text-base sm:text-lg text-slate-500 max-w-lg mx-auto leading-relaxed">
        Esta es la puerta de entrada a tu espacio de trabajo. 
        <span class="block sm:inline">Organiza, colabora y da vida a tus ideas.</span>
      </p>

      <!-- indicador visual de "moderno" (sin funcionalidad) -->
      <div class="mt-8 flex flex-wrap items-center justify-center gap-3 text-sm font-medium text-slate-400">
        <span class="inline-flex items-center gap-1.5 px-4 py-2 rounded-full bg-white/60 border border-slate-200/70 shadow-sm">
          <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
          listo para empezar
        </span>
        <span class="inline-flex items-center gap-1.5 px-4 py-2 rounded-full bg-white/60 border border-slate-200/70 shadow-sm">
          <svg class="w-4 h-4 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
          </svg>
          productividad
        </span>
      </div>

      <!-- pequeño pie de bienvenida (solo estético) -->
      <div class="mt-10 text-xs text-slate-400/80 tracking-wide uppercase">
        <span class="bg-white/40 px-5 py-1.5 rounded-full border border-slate-100/60 backdrop-blur-sm">
          ✦ inicio · 2026 ✦
        </span>
      </div>

    </div>
  </main>

</body>
</html>
